<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Getting started | Knowledge Base HTML Template</title>
    <link rel="icon" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Display:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="header-container">
            <div class="header-left-block">
                <button class="burger-btn-left burger-btn">
                    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" class="h-6 w-6 stroke-slate-500">
                        <path d="M4 7h16M4 12h16M4 17h16"></path>
                      </svg>
                </button>

                <a href="logo">
                    <svg width="30" height="30" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M7.03625 12.1875L1.8125 15L7.03625 17.8125M7.03625 12.1875L14 15.9375L20.9637 12.1875M7.03625 12.1875L1.8125 9.375L14 2.8125L26.1875 9.375L20.9637 12.1875M7.03625 17.8125L1.8125 20.625L14 27.1875L26.1875 20.625L20.9637 17.8125M7.03625 17.8125L14 21.5625L20.9637 17.8125M20.9637 12.1875L26.1875 15L20.9637 17.8125" stroke="#0EA5E9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </a>

            </div>
            <div class="header-right-block">
                <div class="search">
                    <div class="search-content">
                        <div class="zoom-logo">
                            <svg class="h-5 w-5 text-slate-400" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                                <path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM2 9a7 7 0 1112.452 4.391l3.328 3.329a.75.75 0 11-1.06 1.06l-3.329-3.328A7 7 0 012 9z" clip-rule="evenodd"></path>
                              </svg>
                        </div>
                        <div class="input-container">
                            <input type="search" placeholder="Search">
                        </div>
                    </div>
                </div>

                <button class="burger-btn-right burger-btn">
                    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" class="h-6 w-6 stroke-slate-500">
                        <path d="M4 7h16M4 12h16M4 17h16"></path>
                      </svg>
                </button>
            </div>
        </div>
    </header>
</body>
</html>
